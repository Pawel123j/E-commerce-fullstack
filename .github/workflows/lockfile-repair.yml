name: Temporary full-stack dependency repair
on:
  push:
    branches: ["codex/portfolio-polish-2026-11-02"]
    paths: [".github/workflows/lockfile-repair.yml"]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Repair and validate client lockfile
        working-directory: client
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
      - name: Repair and validate server lockfile
        working-directory: server
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
      - name: Export validated client and server locks
        run: |
          node -e "const fs=require('fs');for(const [key,path] of [['CLIENT','client/package-lock.json'],['SERVER','server/package-lock.json']]){const b=fs.readFileSync(path).toString('base64');for(let i=0;i<b.length;i+=6000)console.log('LOCKFILE_'+key+'_CHUNK_'+i+':'+b.slice(i,i+6000));console.log('LOCKFILE_'+key+'_DONE')}"
