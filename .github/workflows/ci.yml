name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend (build + testy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Generowanie klienta Prisma
        run: npx prisma generate

      - name: Kompilacja TypeScriptu
        run: npm run build

      - name: Audyt zależności
        # W dniu commita `npm audit` zwraca tutaj zero podatności — łącznie
        # z low. Blokujemy jednak dopiero na `high`, i to jest świadomy
        # kompromis: próg `low` sprawiłby, że pierwszy nowy komunikat
        # o podatności w dowolnej zależności deweloperskiej zapala CI na
        # czerwono na commicie, którego nikt nie dotykał. Niższe progi
        # sprawdzamy ręcznie przy aktualizacjach zależności.
        run: npm audit --audit-level=high

      - name: Testy endpointów
        # Testy same stawiają bazę w katalogu tymczasowym i ustawiają
        # JWT_SECRET — serwer celowo odmawia startu bez tej zmiennej.
        run: npm test

  client:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npm run typecheck

      - name: Audyt zależności
        run: npm audit --audit-level=high

      - name: Build produkcyjny
        run: npm run build

  browser:
    name: Checkout browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Build backend
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Build frontend for isolated API
        working-directory: client
        env:
          VITE_API_URL: http://127.0.0.1:18311/api
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: e2e/artifacts/
