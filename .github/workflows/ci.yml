name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend (build + testy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Generowanie klienta Prisma
        run: npx prisma generate

      - name: Kompilacja TypeScriptu
        run: npm run build

      - name: Audyt zależności
        # W dniu commita `npm audit` zwraca tutaj zero podatności — łącznie
        # z low. Blokujemy jednak dopiero na `high`, i to jest świadomy
        # kompromis: próg `low` sprawiłby, że pierwszy nowy komunikat
        # o podatności w dowolnej zależności deweloperskiej zapala CI na
        # czerwono na commicie, którego nikt nie dotykał. Niższe progi
        # sprawdzamy ręcznie przy aktualizacjach zależności.
        run: npm audit --audit-level=high

      - name: Testy endpointów
        # Testy same stawiają bazę w katalogu tymczasowym i ustawiają
        # JWT_SECRET — serwer celowo odmawia startu bez tej zmiennej.
        run: npm test

  client:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npm run typecheck

      - name: Audyt zależności
        run: npm audit --audit-level=high

      - name: Build produkcyjny
        run: npm run build
