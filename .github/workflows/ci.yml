name: CI

on:
  # Gałęzie robocze testuje zdarzenie pull_request. Wcześniej `push` na każdej
  # gałęzi uruchamiał ten sam zestaw drugi raz (w tym job z Playwrightem).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy push do PR-a anuluje przebieg, który i tak jest już nieaktualny.
# Przebiegi na main nie są anulowane, żeby każdy commit miał pełny wynik.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Backend (build + testy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Generowanie klienta Prisma
        run: npx prisma generate

      - name: Kompilacja TypeScriptu
        run: npm run build

      - name: Audyt zależności
        # W dniu commita `npm audit` zwraca tutaj zero podatności — łącznie
        # z low. Blokujemy jednak dopiero na `high`, i to jest świadomy
        # kompromis: próg `low` sprawiłby, że pierwszy nowy komunikat
        # o podatności w dowolnej zależności deweloperskiej zapala CI na
        # czerwono na commicie, którego nikt nie dotykał. Niższe progi
        # sprawdzamy ręcznie przy aktualizacjach zależności.
        run: npm audit --audit-level=high

      - name: Testy endpointów
        # Testy same stawiają bazę w katalogu tymczasowym i ustawiają
        # JWT_SECRET — serwer celowo odmawia startu bez tej zmiennej.
        run: npm test

  client:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npm run typecheck

      - name: Audyt zależności
        run: npm audit --audit-level=high

      - name: Build produkcyjny
        run: npm run build

  browser:
    name: Checkout browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Build backend
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Build frontend for isolated API
        working-directory: client
        env:
          VITE_API_URL: http://127.0.0.1:18311/api
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
      # Artefakty tylko przy porażce i z krótką retencją: przy `always()` każdy
      # przebieg zostawiał ~250 KB na 90 dni (16 artefaktów w jedno popołudnie),
      # a konto ma ograniczony budżet storage w Actions.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: e2e/artifacts/
          retention-days: 7
