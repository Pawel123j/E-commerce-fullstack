name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend (build + testy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Generowanie klienta Prisma
        run: npx prisma generate

      - name: Kompilacja TypeScriptu
        run: npm run build

      - name: Audyt zależności
        # Reject every reported severity; repeat the audit on each revision.
        run: npm audit --audit-level=low

      - name: Testy endpointów
        # Testy same stawiają bazę w katalogu tymczasowym i ustawiają
        # JWT_SECRET — serwer celowo odmawia startu bez tej zmiennej.
        run: npm test

  client:
    name: Frontend (storage regressions + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npm run typecheck

      - name: Testy koszyka i sesji przy awarii storage
        run: npm test

      - name: Audyt zależności
        run: npm audit --audit-level=low

      - name: Build produkcyjny
        run: npm run build

  browser:
    name: Checkout browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Build backend
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Build frontend for isolated API
        working-directory: client
        env:
          VITE_API_URL: http://127.0.0.1:18311/api
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: e2e/artifacts/
